name: Sutra BDD Scenario Generator

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "owner/repo Sutra operates on (skill's Fixed Configuration: pulsepointinc/qa-automation)"
        required: true
        default: "pulsepointinc/qa-automation"
        type: string
      use_netra_artifact:
        description: "Set to true to use downloaded Netra artifacts as input"
        required: false
        default: false
        type: boolean
      netra_run_id:
        description: "Optional: Specific Run ID of Netra workflow (leave blank for latest)"
        required: false
        type: string
      source_type:
        description: "Input source"
        required: false
        type: choice
        options: [jira, sheet, doc, sheet_and_doc]
      source_ref:
        description: "Jira key (QA-1498), Sheet name/URL, or Doc name/URL — space-separate for sheet_and_doc"
        required: false
        type: string
      restrict_to:
        description: "Optional: restrict to a single ticket/tab (e.g. ET-24713) instead of the whole sheet/doc"
        required: false
        type: string


permissions:
  contents: write
  pull-requests: write

jobs:
  run-sutra:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo }}
          token: ${{ env.REPO_TOKEN }}
          fetch-depth: 0

      - name: Fetch all remote branches (for Sutra_NNN resolution)
        run: git fetch --all

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python (for mcp-atlassian via uvx, and STEP 5's column-width script)
        uses: actions/setup-python@v5
        with:
         python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code@latest
          claude --version
          claude update || true
          claude --version

      - name: Configure git identity
        run: |
          git config --global user.name "sutra-bot"
          git config --global user.email "sutra-bot@users.noreply.github.com"

      - name: Authenticate gh CLI
        run: gh auth setup-git
        env:
          GH_TOKEN: ${{ env.REPO_TOKEN }}

      - name: Write Google Drive OAuth files
        env:
          GDRIVE_OAUTH_CREDS_JSON: ${{ secrets.GDRIVE_OAUTH_CREDENTIALS_JSON }}
          GDRIVE_TOKENS_JSON: ${{ secrets.GDRIVE_TOKENS_JSON }}
        run: |
          cat > "${RUNNER_TEMP}/gcp-oauth.keys.json" <<< "$GDRIVE_OAUTH_CREDS_JSON"
          cat > "${RUNNER_TEMP}/tokens.json" <<< "$GDRIVE_TOKENS_JSON"

      - name: Sanity-check Google Drive credential files
        run: |
          for f in "${RUNNER_TEMP}/gcp-oauth.keys.json" "${RUNNER_TEMP}/tokens.json"; do
            if ! python3 -m json.tool "$f" > /dev/null 2>&1; then
              echo "::error::$f is not valid JSON (size: $(wc -c < "$f") bytes) — the matching secret is likely empty or unset."
              exit 1
            fi
          done
          
      - name: Download Netra Deliverables Artifact
        if: ${{ inputs.use_netra_artifact }}
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ env.REPO_TOKEN }}
          workflow: netra.yml # Update this to the exact YAML filename of your Netra workflow
          name: netra-deliverables
          run_id: ${{ inputs.netra_run_id }} # If empty, it automatically fetches the latest run
          path: ./inputs/netra-deliverables

      - name: Inspect Downloaded Netra Artifacts
        if: ${{ inputs.use_netra_artifact }}
        run: |
          echo "Downloaded files from Netra:"
          ls -la ./inputs/netra-deliverables          

      - name: Debug mcp-atlassian startup
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: timeout 15 uvx mcp-atlassian || true

      - name: Render MCP server config
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_USERNAME: ${{ secrets.JIRA_USERNAME }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GDRIVE_CREDS_PATH: ${{ runner.temp }}/gcp-oauth.keys.json
          GDRIVE_TOKEN_PATH: ${{ runner.temp }}/tokens.json
        run: |
          cat > mcp-config.json <<EOF
          {
            "mcpServers": {
              "google-drive": {
                "command": "npx",
                "args": ["-y", "@piotr-agier/google-drive-mcp"],
                "env": {
                  "GOOGLE_DRIVE_OAUTH_CREDENTIALS": "${GDRIVE_CREDS_PATH}",
                  "GOOGLE_DRIVE_MCP_TOKEN_PATH": "${GDRIVE_TOKEN_PATH}"
                }
              },
              "atlassian": {
                "command": "uvx",
                "args": ["mcp-atlassian"],
                "env": {
                  "JIRA_URL": "${JIRA_URL}",
                  "JIRA_USERNAME": "${JIRA_USERNAME}",
                  "JIRA_API_TOKEN": "${JIRA_API_TOKEN}"
                }
              }
            }
          }
          EOF

      - name: Run Sutra
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ env.REPO_TOKEN }}
          SOURCE_TYPE: ${{ inputs.source_type }}
          SOURCE_REF: ${{ inputs.source_ref }}
          RESTRICT_TO: ${{ inputs.restrict_to }}
        run: |
          PROMPT="/sutra ${SOURCE_TYPE}: ${SOURCE_REF}"
          if [ -n "$RESTRICT_TO" ]; then
            PROMPT="$PROMPT (restrict to ${RESTRICT_TO} only)"
          fi
          claude -p "$PROMPT" \
            --mcp-config mcp-config.json \
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,mcp__google-drive__*,mcp__atlassian__*" \
            --permission-mode bypassPermissions \
            --model opus \
            --output-format text \
            2>&1 | tee sutra-run.log

      - name: Verify Sutra produced a PR (surface Halting Conditions)
        if: always()
        run: |
          {
            echo "### Sutra run summary"
            echo '```'
            tail -n 80 sutra-run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if ! grep -qE "https://github\.com/[^ ]+/pull/[0-9]+" sutra-run.log; then
            echo "::error::No PR URL found in Sutra's output — it likely hit a Halting Condition instead of completing STEP 6. See the log above."
            exit 1
          fi

      - name: Upload run transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sutra-run-log
          path: sutra-run.log
name: Sutra test design

on:
  workflow_run:
    workflows:
      - Netra QA analysis
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: sutra-netra-run-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  run-sutra:
    # Disabled until the reference implementation is reviewed and merged.
    if: ${{ false && github.event.workflow_run.conclusion == 'success' }}
    name: Design Gherkin from Netra artifact
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION || '2.1.281' }}
      NETRA_OUTPUT_DIR: target/netra
      SUTRA_OUTPUT_DIR: target/sutra
      NETRA_RUN_ID: ${{ github.event.workflow_run.id }}
      SUTRA_MAX_BUDGET_USD: ${{ vars.SUTRA_MAX_BUDGET_USD || '25' }}

    steps:
      - name: Checkout Netra's repository revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .claude/skills/gherkin-design/requirements.txt

      - name: Install Sutra Python dependencies
        run: >-
          python -m pip install
          --requirement .claude/skills/gherkin-design/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install deterministic Gherkin formatter
        run: npm ci

      - name: Install Claude subprocess sandbox
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap socat

      - name: Install pinned Claude Code CLI
        run: |
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      - name: Download the triggering Netra artifact
        uses: actions/download-artifact@v5
        with:
          name: netra-analysis
          path: ${{ runner.temp }}/netra-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate and stage Netra handoff
        run: |
          python .claude/skills/jira-analysis/scripts/validate-analysis.py \
            "${RUNNER_TEMP}/netra-artifact/analysis.json"
          mkdir -p "${NETRA_OUTPUT_DIR}"
          cp "${RUNNER_TEMP}/netra-artifact/analysis.json" \
            "${NETRA_OUTPUT_DIR}/analysis.json"

      - name: Prepare Sutra output and empty MCP configuration
        run: |
          rm -rf "${SUTRA_OUTPUT_DIR}"
          mkdir -p "${SUTRA_OUTPUT_DIR}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "sutra-mcp.json"
          path.write_text(json.dumps({"mcpServers": {}}), encoding="utf-8")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write(f"SUTRA_MCP_CONFIG_PATH={path}\n")
          PY

      - name: Run Sutra
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          CLAUDE_CODE_SKIP_PROMPT_HISTORY: "1"
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::Missing ANTHROPIC_API_KEY GitHub Secret."
            exit 1
          fi

          prompt=$(printf '%s\n' \
            "Create Sutra test design from target/netra/analysis.json." \
            "deliveryMode: artifact_only" \
            "outputDir: target/sutra" \
            "Write complete staged feature files under target/sutra/features/." \
            "Write the structured handoff to target/sutra/test-design-output.json." \
            "Do not query Jira, use MCP, or modify files outside target/sutra/.")

          claude --agent sutra \
            --print "${prompt}" \
            --mcp-config "${SUTRA_MCP_CONFIG_PATH}" \
            --strict-mcp-config \
            --permission-mode dontAsk \
            --allowedTools "Read,Grep,Glob,Write,Bash" \
            --model sonnet \
            --max-budget-usd "${SUTRA_MAX_BUDGET_USD}" \
            --no-session-persistence \
            --output-format text

      - name: Format and validate Sutra handoff
        run: |
          mapfile -t feature_files < <(python - <<'PY'
          import json
          from pathlib import Path

          output_root = Path("target/sutra").resolve()
          design = json.loads(Path("target/sutra/test-design-output.json").read_text(encoding="utf-8"))
          for item in design["featureFiles"]:
              path = Path(item["artifactPath"]).resolve()
              if output_root not in path.parents:
                  raise SystemExit(f"Feature artifact is outside target/sutra: {path}")
              print(path)
          PY
          )

          if [ "${#feature_files[@]}" -gt 0 ]; then
            python .claude/skills/gherkin-design/scripts/align-feature-tables.py "${feature_files[@]}"
            scripts/check-feature-format.sh "${feature_files[@]}"
          else
            echo "Sutra produced no feature files; all test cases were triaged without authored scenarios."
          fi

          python .claude/skills/gherkin-design/scripts/validate-test-design.py \
            "${NETRA_OUTPUT_DIR}/analysis.json" \
            "${SUTRA_OUTPUT_DIR}/test-design-output.json"

      - name: Verify repository boundary
        run: |
          changes=$(git status --porcelain --untracked-files=all -- . \
            ':(exclude)target/**')
          if [ -n "${changes}" ]; then
            echo "::error::Sutra modified files outside target/."
            printf '%s\n' "${changes}"
            exit 1
          fi

      - name: Add run summary
        run: |
          {
            echo "### Sutra test design"
            echo
            echo "- Netra run ID: `${NETRA_RUN_ID}`"
            echo "- Source: `${NETRA_OUTPUT_DIR}/analysis.json`"
            echo "- Output: `${SUTRA_OUTPUT_DIR}/`"
            echo "- Contract and Gherkin validation: passed"
            echo "- Atlassian MCP: not used"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Sutra deliverables
        uses: actions/upload-artifact@v4
        with:
          name: sutra-test-design-${{ github.event.workflow_run.id }}
          path: target/sutra/
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary MCP configuration
        if: always()
        run: rm -f "${SUTRA_MCP_CONFIG_PATH:-${RUNNER_TEMP}/sutra-mcp.json}"

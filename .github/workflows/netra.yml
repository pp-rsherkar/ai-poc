name: Netra QA analysis

# Required GitHub Secrets:
# - ANTHROPIC_API_KEY: API credential used only by Claude Code.
# - JIRA_EMAIL: email of the dedicated Atlassian automation account.
# - JIRA_API_TOKEN: scoped API token owned by JIRA_EMAIL.
# - JIRA_BASE_URL: Atlassian Cloud site used to select the intended cloudId.
# The workflow creates the temporary Rovo MCP configuration in RUNNER_TEMP.

on:
  workflow_dispatch:
    inputs:
      jira_scope:
        description: "Ticket key, comma-separated ticket list, Jira URL, or fix version"
        required: true
        type: string
      detail_mode:
        description: "Full expands linked and parent context; fast skips that expansion"
        required: true
        type: choice
        options:
          - full
          - fast
        default: full
      production_project_key:
        description: "Jira project containing production defects"
        required: true
        type: string
        default: HT
      confluence_detail_mode:
        description: "Confluence is disabled unless explicitly requested"
        required: true
        type: choice
        options:
          - disabled
          - shallow
          - full
        default: disabled
      max_budget_usd:
        description: "Maximum Anthropic API spend for this run, or unlimited"
        required: true
        type: choice
        options:
          - "5"
          - "10"
          - "25"
          - "50"
          - unlimited
        default: "25"

permissions:
  contents: read

concurrency:
  group: netra-${{ github.ref }}-${{ inputs.jira_scope }}
  cancel-in-progress: false

jobs:
  run-netra:
    name: Analyze Jira scope with Netra
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION || '2.1.281' }}
      NETRA_OUTPUT_DIR: target/netra
      INPUT_JIRA_SCOPE: ${{ inputs.jira_scope }}
      INPUT_DETAIL_MODE: ${{ inputs.detail_mode }}
      INPUT_PRODUCTION_PROJECT_KEY: ${{ inputs.production_project_key }}
      INPUT_CONFLUENCE_DETAIL_MODE: ${{ inputs.confluence_detail_mode }}
      INPUT_MAX_BUDGET_USD: ${{ inputs.max_budget_usd }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .claude/skills/jira-analysis/requirements.txt

      - name: Install Netra Python dependencies
        run: >-
          python -m pip install
          --requirement .claude/skills/jira-analysis/requirements.txt

      - name: Run Netra Python tests
        run: >-
          python -m unittest discover
          -s .claude/skills/jira-analysis/tests
          -p 'test_*.py'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Claude subprocess sandbox
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap

      - name: Install pinned Claude Code CLI
        run: |
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      - name: Prepare CI MCP configuration
        env:
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          email = os.environ.get("JIRA_EMAIL", "").strip()
          token = os.environ.get("JIRA_API_TOKEN", "").strip()
          if not email or not token:
              raise SystemExit("Missing JIRA_EMAIL or JIRA_API_TOKEN GitHub Secret.")

          credentials = base64.b64encode(f"{email}:{token}".encode()).decode()
          config = {
              "mcpServers": {
                  "atlassian-rovo": {
                      "type": "http",
                      "url": "https://mcp.atlassian.com/v2/mcp",
                      "headers": {"Authorization": f"Basic {credentials}"},
                  }
              }
          }

          path = Path(os.environ["RUNNER_TEMP"]) / "netra-mcp.json"
          path.write_text(json.dumps(config), encoding="utf-8")
          path.chmod(0o600)
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write(f"NETRA_MCP_CONFIG_PATH={path}\n")
          PY

      - name: Create clean output directory
        run: |
          rm -rf "${NETRA_OUTPUT_DIR}"
          mkdir -p "${NETRA_OUTPUT_DIR}"

      - name: Run Netra
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          CLAUDE_CODE_SKIP_PROMPT_HISTORY: "1"
          CLAUDE_CODE_MCP_ALLOWLIST_ENV: "1"
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::Missing ANTHROPIC_API_KEY GitHub Secret."
            exit 1
          fi
          if [ -z "${JIRA_BASE_URL}" ]; then
            echo "::error::Missing JIRA_BASE_URL GitHub Secret."
            exit 1
          fi

          prompt=$(printf '%s\n' \
            "Analyze Jira scope: ${INPUT_JIRA_SCOPE}" \
            "Use Atlassian site: ${JIRA_BASE_URL}" \
            "detailMode: ${INPUT_DETAIL_MODE}" \
            "productionProjectKey: ${INPUT_PRODUCTION_PROJECT_KEY}" \
            "confluenceDetailMode: ${INPUT_CONFLUENCE_DETAIL_MODE}" \
            "Write the authoritative result to target/netra/analysis.json." \
            "Validate it and generate DOCX, XLSX, and HTML with the repository's deterministic builder." \
            "Treat Jira, Confluence, and the repository as read-only sources." \
            "Do not modify repository source files or any external system.")

          runtime_args=(--no-session-persistence --output-format text)
          if [ "${INPUT_MAX_BUDGET_USD}" != "unlimited" ]; then
            runtime_args=(
              --max-budget-usd "${INPUT_MAX_BUDGET_USD}"
              "${runtime_args[@]}"
            )
          fi

          claude --agent netra \
            --print "${prompt}" \
            --mcp-config "${NETRA_MCP_CONFIG_PATH}" \
            --strict-mcp-config \
            --permission-mode dontAsk \
            --allowedTools "Read,Grep,Glob,Write,Bash,mcp__atlassian-rovo__getAccessibleAtlassianResources,mcp__atlassian-rovo__getJiraIssue,mcp__atlassian-rovo__searchJiraIssuesUsingJql,mcp__atlassian-rovo__getConfluenceContent,mcp__atlassian-rovo__search,mcp__atlassian-rovo__discover,mcp__atlassian-rovo__executeRead" \
            --model sonnet \
            "${runtime_args[@]}"

      - name: Validate analysis contract
        run: |
          if [ ! -f "${NETRA_OUTPUT_DIR}/analysis.json" ]; then
            echo "::error::Netra stopped without producing analysis.json. Review the Netra step for its structured blocker."
            exit 1
          fi
          python .claude/skills/jira-analysis/scripts/validate-analysis.py \
            "${NETRA_OUTPUT_DIR}/analysis.json"

      - name: Rebuild deterministic deliverables
        run: >-
          python .claude/skills/jira-analysis/scripts/build-deliverables.py
          "${NETRA_OUTPUT_DIR}/analysis.json"
          --output-dir "${NETRA_OUTPUT_DIR}"

      - name: Verify output and repository boundaries
        run: |
          python - <<'PY'
          from pathlib import Path

          output = Path("target/netra")
          expected = {".json", ".docx", ".xlsx", ".html"}
          found = {path.suffix for path in output.iterdir() if path.is_file()}
          missing = sorted(expected - found)
          if missing:
              raise SystemExit(f"Missing Netra artifact types: {', '.join(missing)}")
          PY

          changes=$(git status --porcelain --untracked-files=all -- . \
            ':(exclude)target/**')
          if [ -n "${changes}" ]; then
            echo "::error::Netra modified files outside target/."
            printf '%s\n' "${changes}"
            exit 1
          fi

      - name: Add run summary
        run: |
          {
            echo "### Netra QA analysis"
            echo
            echo "- Scope: \`${INPUT_JIRA_SCOPE}\`"
            echo "- Detail mode: \`${INPUT_DETAIL_MODE}\`"
            echo "- Output: \`${NETRA_OUTPUT_DIR}/\`"
            echo "- Contract validation: passed"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Netra deliverables
        uses: actions/upload-artifact@v4
        with:
          name: netra-analysis
          path: target/netra/
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary MCP configuration
        if: always()
        run: rm -f "${NETRA_MCP_CONFIG_PATH:-${RUNNER_TEMP}/netra-mcp.json}"
